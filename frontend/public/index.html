<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Axiom Login</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="intro-panel" aria-labelledby="brand-title">
        <p class="eyebrow">Axiom</p>
        <h1 id="brand-title">Find the next story that thinks with you.</h1>
        <p class="intro-copy">
          Sign in to explore philosophical fiction recommendations shaped by theme,
          character, and the ideas you want to follow.
        </p>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-header">
          <p class="eyebrow">Welcome back</p>
          <h2 id="login-title">Log in to Axiom</h2>
        </div>

        <form class="login-form" action="#" method="post">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit">Log in</button>
        </form>

        <p class="signup-copy">
          New to Axiom? <a href="#">Create an account</a>
        </p>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
