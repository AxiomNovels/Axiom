<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | Axiom</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a class="nav-cta" href="/signup.html">Sign up</a>
      </nav>
    </header>

    <main class="auth-shell">
      <section class="auth-intro" aria-labelledby="login-brand-title">
        <img src="/assets/axiom-logo.png" alt="" class="auth-mark">
        <p class="eyebrow">Your Axiom account</p>
        <h1 id="login-brand-title">Ignite your passion for webnovels.</h1>
        <p>Get back to your reading lists, reviews, friends, and more.</p>
      </section>

      <section class="auth-panel" aria-labelledby="password-title">
        <div class="auth-header">
          <h2 id="password-title">Choose a new password</h2>
          <p>Enter and confirm your new password below.</p>
        </div>
        <form class="auth-form" data-password-form="reset">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters" required>
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <p class="auth-error is-hidden" data-auth-error role="alert"></p>
          <p class="is-hidden" data-password-status role="status" aria-live="polite"></p>
          <button type="submit">Reset password</button>
        </form>
        <p class="auth-switch"><a href="/login.html">Back to log in</a> · <a href="/forgot-password.html">Request a new reset link</a></p>
      </section>
    </main>

    <script src="/password-recovery.js"></script>
    <script src="/runtime-config.js"></script><script src="/script.js"></script>
  </body>
</html>
