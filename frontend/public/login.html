<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Axiom</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a class="nav-cta" href="/signup.html">Sign up</a>
      </nav>
    </header>

    <main class="auth-shell">
      <section class="auth-intro" aria-labelledby="login-brand-title">
        <img src="/assets/axiom-logo.png" alt="" class="auth-mark">
        <p class="eyebrow">Return to the archive</p>
        <h1 id="login-brand-title">Find the next story that thinks with you.</h1>
        <p>
          Log in to keep shaping recommendations around the ideas, characters,
          and moral tensions you want to follow next.
        </p>
      </section>

      <section class="auth-panel" aria-labelledby="login-title">
        <div class="auth-header">
          <p class="eyebrow">Welcome back</p>
          <h2 id="login-title">Log in to Axiom</h2>
        </div>

        <form class="auth-form" action="#" method="post" data-demo-message="Local demo only: login is not connected yet.">
          <label for="identifier">Email or username</label>
          <input
            id="identifier"
            name="identifier"
            type="text"
            autocomplete="username"
            placeholder="you@example.com or username"
            required
          >

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <p class="auth-error is-hidden" data-auth-error role="alert" aria-live="polite"></p>

          <button type="submit">Log in</button>
        </form>

        <p class="auth-switch">
          New to Axiom? <a href="/signup.html">Create an account</a>
        </p>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
