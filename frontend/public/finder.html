<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Series Finder | Axiom</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/novel.css">
    <link rel="stylesheet" href="/finder.css">
  </head>
  <body>
    <header class="site-header home-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links reader-nav" aria-label="Primary navigation">
        <a href="/finder.html" aria-current="page">Finder</a>
        <a href="/readers.html">Readers</a>
        <a href="/#popular">Popular</a>
      </nav>
      <form class="top-search-form search-form" action="/search.html" method="get" aria-label="Search novels">
        <label for="novel-search">Search novels</label>
        <div class="search-row">
          <input id="novel-search" name="q" type="search" placeholder="Search titles, authors, themes...">
          <button type="submit">Search</button>
        </div>
      </form>
      <nav class="nav-links account-nav" aria-label="Account navigation">
        <div class="guest-actions" data-guest-actions><a href="/login.html">Log in</a><a class="nav-cta" href="/signup.html">Sign up</a></div>
        <div class="user-actions is-hidden" data-user-actions><span class="user-greeting" data-user-greeting></span><button class="logout-button" type="button" data-logout-button>Log out</button></div>
      </nav>
    </header>

    <main class="finder-page">
      <section class="finder-heading">
        <h1>Series Finder</h1>
      </section>

      <form class="finder-form" action="/search.html" method="get" data-finder-form>
        <section class="finder-section">
          <div class="finder-fields three-column">
            <label>Search<input name="q" type="search" placeholder="Title, author, or keyword"></label>
            <label>Status<select name="status"><option value="">Any status</option></select></label>
            <div class="finder-rating-field">
              <span class="finder-field-label">Rating</span>
              <div class="finder-star-filter" data-rating-filter>
                <div class="finder-stars" role="slider" tabindex="0" aria-label="Rating" aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="0" aria-valuetext="Any rating" data-rating-stars>
                  <button type="button" tabindex="-1" data-star="1" aria-label="1 star and up"><span aria-hidden="true">★</span></button>
                  <button type="button" tabindex="-1" data-star="2" aria-label="2 stars and up"><span aria-hidden="true">★</span></button>
                  <button type="button" tabindex="-1" data-star="3" aria-label="3 stars and up"><span aria-hidden="true">★</span></button>
                  <button type="button" tabindex="-1" data-star="4" aria-label="4 stars and up"><span aria-hidden="true">★</span></button>
                  <button type="button" tabindex="-1" data-star="5" aria-label="5 stars only"><span aria-hidden="true">★</span></button>
                </div>
                <div class="finder-rating-copy">
                  <output data-rating-output>Any rating</output>
                  <button type="button" class="finder-rating-clear" data-rating-clear hidden>Clear</button>
                </div>
                <input type="hidden" name="min_rating" data-rating-value>
              </div>
            </div>
          </div>
        </section>

        <section class="finder-section" aria-labelledby="genre-heading">
          <div class="finder-filter-heading">
            <h2 id="genre-heading">Genres</h2>
            <select name="genre_mode" aria-label="Genres matching mode" title="AND: match all included genres. OR: match any.">
              <option value="and" selected>AND</option>
              <option value="or">OR</option>
            </select>
          </div>
          <p class="finder-hint" id="genre-help">Click to include. Click twice to exclude.</p>
          <div class="genre-grid" data-genre-options role="group" aria-label="Genres" aria-describedby="genre-help"><p role="status">Loading genres…</p></div>
          <input type="hidden" name="include_genres" data-included-genres>
          <input type="hidden" name="exclude_genres" data-excluded-genres>
        </section>

        <section class="finder-section">
          <div class="finder-filter-heading">
            <h2 id="tag-heading">Tags</h2>
            <select name="tag_mode" aria-label="Tags matching mode" title="AND: match all included tags. OR: match any.">
              <option value="and" selected>AND</option>
              <option value="or">OR</option>
            </select>
          </div>
          <div class="finder-tag-fields">
            <div data-tag-field="include">
              <div class="tag-combobox">
                <label class="finder-visually-hidden" for="tag-search">Include tags</label>
                <input id="tag-search" type="search" autocomplete="off" placeholder="Include tags…" aria-autocomplete="list" aria-controls="tag-suggestions" aria-expanded="false">
                <div class="tag-suggestions" id="tag-suggestions" role="listbox" aria-label="Tags to include" data-tag-suggestions hidden></div>
              </div>
              <div class="selected-tags" data-selected-tags aria-live="polite"></div>
            </div>
            <div data-tag-field="exclude">
              <div class="tag-combobox">
                <label class="finder-visually-hidden" for="excluded-tag-search">Exclude tags</label>
                <input id="excluded-tag-search" type="search" autocomplete="off" placeholder="Exclude tags…" aria-autocomplete="list" aria-controls="excluded-tag-suggestions" aria-expanded="false">
                <div class="tag-suggestions" id="excluded-tag-suggestions" role="listbox" aria-label="Tags to exclude" data-tag-suggestions hidden></div>
              </div>
              <div class="selected-tags" data-selected-tags aria-live="polite"></div>
            </div>
          </div>
          <input type="hidden" name="include_tags" data-included-tags>
          <input type="hidden" name="exclude_tags" data-excluded-tags>
        </section>

        <section class="finder-section advanced-filters">
          <div class="finder-filter-heading"><h2>Protagonist Profile</h2></div>
          <div class="profile-filter-grid" data-profile-filters="protagonist"></div>
        </section>

        <div class="finder-actions">
          <button class="clear-filters" type="reset">Clear all</button>
          <button class="finder-submit" type="submit">Search <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </main>
    <script src="/script.js"></script>
    <script src="/finder.js"></script>
  </body>
</html>
