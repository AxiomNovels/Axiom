<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Activity | Axiom</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/novel.css">
    <link rel="stylesheet" href="/activity.css">
  </head>
  <body>
    <header class="site-header home-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links reader-nav" aria-label="Primary navigation">
        <a href="/finder.html">Finder</a>
        <a href="/readers.html">Readers</a>
        <a href="/#popular">Popular</a>
      </nav>
      <form class="top-search-form search-form" action="/search.html" method="get" aria-label="Search novels">
        <label for="novel-search">Search novels</label>
        <div class="search-row">
          <input id="novel-search" name="q" type="search" placeholder="Search novels, authors, keywords...">
          <button type="submit" aria-label="Search">Search</button>
        </div>
      </form>
      <nav class="nav-links account-nav" aria-label="Account navigation">
        <div class="guest-actions" data-guest-actions>
          <a href="/login.html">Log in</a>
          <a class="nav-cta" href="/signup.html">Sign up</a>
        </div>
        <div class="user-actions is-hidden" data-user-actions>
          <span class="user-greeting" data-user-greeting></span>
          <button class="logout-button" type="button" data-logout-button>Log out</button>
        </div>
      </nav>
    </header>

    <main class="user-profile-page activity-page">
      <section class="user-activity-section" aria-labelledby="activity-heading">
        <div class="user-activity-heading">
          <div>
            <p class="eyebrow">Your history</p>
            <h1 id="activity-heading">Activity</h1>
            <p class="activity-intro">Every review and reply you have shared, newest first.</p>
          </div>
          <div class="user-activity-stats" data-user-activity-stats></div>
        </div>

        <div class="friends-tabs activity-tabs" role="tablist" aria-label="Activity type">
          <button
            type="button"
            role="tab"
            id="activity-tab-novels"
            class="friends-tab"
            aria-selected="true"
            aria-controls="activity-panel-novels"
            data-activity-tab="novels"
          >Novels</button>
          <button
            type="button"
            role="tab"
            id="activity-tab-lists"
            class="friends-tab"
            aria-selected="false"
            aria-controls="activity-panel-lists"
            tabindex="-1"
            data-activity-tab="lists"
          >Reading Lists</button>
        </div>

        <div
          id="activity-panel-novels"
          role="tabpanel"
          aria-labelledby="activity-tab-novels"
          data-activity-panel="novels"
        >
          <div class="user-activity-feed" data-user-activity-feed aria-live="polite">
            <p class="user-profile-empty">Loading your activity&hellip;</p>
          </div>
        </div>

        <div
          id="activity-panel-lists"
          role="tabpanel"
          aria-labelledby="activity-tab-lists"
          data-activity-panel="lists"
          hidden
        >
          <div class="user-activity-feed" data-user-list-activity-feed aria-live="polite">
            <p class="user-profile-empty">Loading your activity&hellip;</p>
          </div>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
    <script src="/activity.js"></script>
  </body>
</html>
