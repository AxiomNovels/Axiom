<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Readers | Axiom</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/novel.css">
  </head>
  <body>
    <header class="site-header home-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links reader-nav" aria-label="Primary navigation">
        <a href="/finder.html">Finder</a>
        <a href="/readers.html" aria-current="page">Readers</a>
        <a href="/#popular">Popular</a>
      </nav>
      <form class="top-search-form search-form" action="/search.html" method="get" aria-label="Search novels">
        <label for="novel-search">Search novels</label>
        <div class="search-row">
          <input id="novel-search" name="q" type="search" placeholder="Search novels, authors, keywords...">
          <button type="submit" aria-label="Search">Search</button>
        </div>
      </form>
      <nav class="nav-links account-nav" aria-label="Account navigation">
        <div class="guest-actions" data-guest-actions>
          <a href="/login.html">Log in</a>
          <a class="nav-cta" href="/signup.html">Sign up</a>
        </div>
        <div class="user-actions is-hidden" data-user-actions>
          <span class="user-greeting" data-user-greeting></span>
          <button class="logout-button" type="button" data-logout-button>Log out</button>
        </div>
      </nav>
    </header>

    <main class="reader-directory-page">
      <header class="reader-directory-heading">
        <p class="eyebrow">The Axiom community</p>
        <h1>Meet the readers.</h1>
        <p>Find fellow readers, explore their public profiles, and see the tastes they choose to share.</p>
      </header>

      <form class="reader-directory-search" data-reader-search role="search">
        <label for="reader-query">Search readers</label>
        <div>
          <input id="reader-query" type="search" maxlength="100" placeholder="Search by username" autocomplete="off">
          <button type="submit">Search</button>
        </div>
      </form>

      <div class="reader-directory-toolbar">
        <p class="reader-directory-status" data-reader-status aria-live="polite">Loading readers&hellip;</p>
        <label class="reader-directory-sort" for="reader-sort">Sort by
          <select id="reader-sort" data-reader-sort>
            <option value="last_online" selected>Last online</option>
            <option value="alphabetical">Alphabetical</option>
          </select>
        </label>
      </div>
      <section class="reader-directory-grid" data-reader-results aria-label="Reader directory"></section>
    </main>

    <script src="/script.js"></script>
    <script src="/readers.js"></script>
  </body>
</html>
