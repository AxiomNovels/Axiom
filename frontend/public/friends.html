<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Friends | Axiom</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/novel.css">
  </head>
  <body>
    <header class="site-header home-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links reader-nav" aria-label="Primary navigation">
        <a href="/finder.html">Finder</a>
        <a href="/#popular">Popular</a>
      </nav>
      <form class="top-search-form search-form" action="/search.html" method="get" aria-label="Search novels">
        <label for="novel-search">Search novels</label>
        <div class="search-row">
          <input id="novel-search" name="q" type="search" placeholder="Search novels, themes, moods...">
          <button type="submit" aria-label="Search">Search</button>
        </div>
      </form>
      <nav class="nav-links account-nav" aria-label="Account navigation">
        <div class="guest-actions" data-guest-actions>
          <a href="/login.html">Log in</a>
          <a class="nav-cta" href="/signup.html">Sign up</a>
        </div>
        <div class="user-actions is-hidden" data-user-actions>
          <span class="user-greeting" data-user-greeting></span>
          <button class="logout-button" type="button" data-logout-button>Log out</button>
        </div>
      </nav>
    </header>

    <main class="friends-page">
      <section class="search-results-heading" aria-labelledby="friends-title">
        <p class="eyebrow">Your network</p>
        <h1 id="friends-title">Your friends</h1>
        <p class="friends-summary" data-friends-summary aria-live="polite">Loading your friends&hellip;</p>
      </section>

      <div class="friends-tabs" role="tablist" aria-label="Friends list filter">
        <button
          type="button"
          role="tab"
          id="friends-tab-all"
          class="friends-tab"
          aria-selected="true"
          aria-controls="friends-panel-all"
          data-friends-tab="all"
        >All</button>
        <button
          type="button"
          role="tab"
          id="friends-tab-pending"
          class="friends-tab"
          aria-selected="false"
          aria-controls="friends-panel-pending"
          tabindex="-1"
          data-friends-tab="pending"
        >Pending</button>
      </div>

      <section
        id="friends-panel-all"
        role="tabpanel"
        aria-labelledby="friends-tab-all"
        data-friends-panel="all"
      >
        <div class="friends-list" data-friends-list="all">
          <p>Loading&hellip;</p>
        </div>
      </section>

      <section
        id="friends-panel-pending"
        role="tabpanel"
        aria-labelledby="friends-tab-pending"
        data-friends-panel="pending"
        hidden
      >
        <div class="friends-list" data-friends-list="pending">
          <p>Loading&hellip;</p>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
    <script src="/friends.js"></script>
  </body>
</html>
