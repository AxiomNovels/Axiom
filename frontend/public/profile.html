<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Profile | Axiom</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/novel.css">
  </head>
  <body>
    <header class="site-header home-header">
      <a class="brand" href="/" aria-label="Axiom home">
        <img src="/assets/axiom-mark.png" alt="" class="brand-logo">
        <img src="/assets/axiom-wordmark.png" alt="" class="brand-wordmark">
      </a>
      <nav class="nav-links reader-nav" aria-label="Primary navigation">
        <a href="/finder.html">Finder</a>
        <a href="/#popular">Popular</a>
      </nav>
      <form class="top-search-form search-form" action="/search.html" method="get" aria-label="Search novels">
        <label for="novel-search">Search novels</label>
        <div class="search-row">
          <input id="novel-search" name="q" type="search" placeholder="Search novels, themes, moods...">
          <button type="submit" aria-label="Search">Search</button>
        </div>
      </form>
      <nav class="nav-links account-nav" aria-label="Account navigation">
        <div class="guest-actions" data-guest-actions>
          <a href="/login.html">Log in</a>
          <a class="nav-cta" href="/signup.html">Sign up</a>
        </div>
        <div class="user-actions is-hidden" data-user-actions>
          <span class="user-greeting" data-user-greeting></span>
          <button class="logout-button" type="button" data-logout-button>Log out</button>
        </div>
      </nav>
    </header>

    <main class="profile-manage-page">
      <a class="novel-back-link" href="/lists.html">&larr; Back to your reading lists</a>

      <div class="profile-manage-card">
        <p class="eyebrow">Your account</p>
        <h1>Manage profile</h1>
        <p class="profile-manage-intro">
          Let us know how you want others to view you. <br>
          Profile data can be changed at any time.
        </p>

        <div class="profile-readonly-grid">
          <div class="profile-readonly-item">
            <span>Username</span>
            <strong data-profile-username>Loading&hellip;</strong>
          </div>
          <div class="profile-readonly-item">
            <span>Joined</span>
            <strong data-profile-join-date>Loading&hellip;</strong>
          </div>
        </div>

        <p class="profile-message is-hidden" data-profile-message role="status" aria-live="polite"></p>

        <form data-profile-form>
          <div class="profile-form-row">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Non-Binary">Non-Binary</option>
              <option value="Prefer not to say" selected>Prefer not to say</option>
            </select>
          </div>

          <div class="profile-form-row">
            <label for="city">City</label>
            <input id="city" name="city" type="text" placeholder="e.g. New York" maxlength="120">
          </div>

          <div class="profile-form-row">
            <label for="country">Country</label>
            <input id="country" name="country" type="text" placeholder="e.g. United States" maxlength="120">
          </div>

          <div class="profile-form-row">
            <label for="about-me">About me</label>
            <textarea id="about-me" name="about_me" maxlength="500" placeholder="Tell other readers a bit about yourself..."></textarea>
            <p class="profile-about-counter" data-about-me-counter>0/500 characters</p>
          </div>

          <div class="profile-form-row profile-tags-field">
            <label for="tag-search">Tag preferences</label>
            <div class="tag-combobox">
              <input id="tag-search" type="search" autocomplete="off" placeholder="Start typing a tag..." aria-autocomplete="list" aria-controls="tag-suggestions" aria-expanded="false">
              <div class="tag-suggestions" id="tag-suggestions" role="listbox" data-tag-suggestions hidden></div>
            </div>
            <div class="selected-tags" data-selected-tags aria-live="polite"><p>No tag preferences added yet.</p></div>
          </div>

          <div class="profile-manage-actions">
            <button type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </main>

    <script src="/script.js"></script>
    <script src="/profile.js"></script>
  </body>
</html>
